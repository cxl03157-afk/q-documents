name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ジョブ名は変えない。main のブランチ保護が
  # required_status_checks に "frontend (lint / test / build)" を指定しており、
  # 名前を変えると必須チェックが外れて素通りするようになる。
  # npm workspaces 化で対象は frontend だけでなく shared / backend も含む。
  frontend:
    name: frontend (lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces のため、インストールもコマンドもリポジトリルートで実行する。
      # ルートの node_modules 1つに集約されることで、shared/ が
      # 型チェック（tsc）と lint の対象に入る。
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
